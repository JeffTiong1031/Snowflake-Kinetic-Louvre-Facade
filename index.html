<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snowflake Kinetic Louvre Facade</title>
    <style>
      :root {
        --panel: rgba(18, 21, 26, 0.82);
        --line: rgba(255, 255, 255, 0.12);
        --text: #e8ecf1;
        --muted: #98a2ad;
        --accent: #7fc4e8;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d1014;
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--text);
      }

      canvas { display: block; }

      #panel {
        position: fixed;
        top: 16px;
        left: 16px;
        width: 268px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        max-height: calc(100vh - 32px);
        overflow-y: auto;
      }

      h1 {
        margin: 0 0 2px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .sub {
        margin: 0 0 14px;
        font-size: 11px;
        color: var(--muted);
      }

      fieldset {
        margin: 0 0 14px;
        padding: 12px 0 0;
        border: 0;
        border-top: 1px solid var(--line);
      }

      legend {
        padding: 0 6px 0 0;
        font-size: 10px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--muted);
      }

      label.row {
        display: block;
        margin-bottom: 10px;
      }

      .row-head {
        display: flex;
        justify-content: space-between;
        margin-bottom: 4px;
        font-size: 11px;
      }

      .row-head b { font-weight: 500; }
      .row-head span { color: var(--accent); font-variant-numeric: tabular-nums; }

      input[type="range"] {
        width: 100%;
        height: 3px;
        margin: 0;
        appearance: none;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.16);
        outline: none;
      }

      input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        width: 13px;
        height: 13px;
        border: 0;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
      }

      input[type="range"]::-moz-range-thumb {
        width: 13px;
        height: 13px;
        border: 0;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
      }

      input[type="range"]:disabled { opacity: 0.35; }
      input[type="range"]:disabled::-webkit-slider-thumb { cursor: not-allowed; }

      .checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        font-size: 11px;
        cursor: pointer;
      }

      .checkbox input { accent-color: var(--accent); cursor: pointer; }

      .presets { display: flex; flex-direction: column; gap: 6px; }

      button {
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
        font: inherit;
        font-size: 11px;
        text-align: left;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }

      button:hover {
        background: rgba(127, 196, 232, 0.14);
        border-color: rgba(127, 196, 232, 0.4);
      }

      #stats {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 3px 10px;
        font-size: 11px;
        color: var(--muted);
      }

      #stats span { color: var(--text); font-variant-numeric: tabular-nums; }

      #hint {
        position: fixed;
        right: 16px;
        bottom: 14px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.42);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="panel">
      <h1>Snowflake Kinetic Louvre Facade</h1>
      <p class="sub">30-storey curtain wall &middot; 160 modules &middot; north face</p>

      <fieldset>
        <legend>Sun</legend>

        <label class="row">
          <span class="row-head"><b>Azimuth</b><span id="azOut">135&deg;</span></span>
          <input id="az" type="range" min="0" max="360" step="1" value="135" />
        </label>

        <label class="row">
          <span class="row-head"><b>Elevation</b><span id="elOut">38&deg;</span></span>
          <input id="el" type="range" min="0" max="90" step="1" value="38" />
        </label>

        <label class="row">
          <span class="row-head"><b>Time of day</b><span id="todOut">14:00</span></span>
          <input id="tod" type="range" min="5" max="19" step="0.05" value="14" />
        </label>
      </fieldset>

      <fieldset>
        <legend>Override</legend>

        <label class="checkbox">
          <input id="manual" type="checkbox" />
          Drive all modules manually
        </label>

        <label class="row">
          <span class="row-head"><b>Closed &rarr; open</b><span id="stateOut">1.00</span></span>
          <input id="state" type="range" min="0" max="1" step="0.01" value="1" disabled />
        </label>
      </fieldset>

      <fieldset>
        <legend>Camera</legend>
        <div class="presets">
          <button data-preset="tower">Full tower</button>
          <button data-preset="bay">Fa&ccedil;ade bay</button>
          <button data-preset="module">Single module</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>Stats</legend>
        <div id="stats">
          <b>FPS</b><span id="fps">&mdash;</span>
          <b>Blades</b><span id="blades">&mdash;</span>
          <b>Moving</b><span id="moving">&mdash;</span>
          <b>Draw calls</b><span id="calls">&mdash;</span>
          <b>Shadow map</b><span id="shadow">&mdash;</span>
        </div>
      </fieldset>
    </div>

    <div id="hint">drag to orbit &middot; scroll to zoom</div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
